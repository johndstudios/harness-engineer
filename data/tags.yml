# Controlled tag vocabulary for resources.
#
# Each entry is a tag slug + a short description. The lint script enforces that
# every `tags:` value in content/resources/*.md appears here. To add a new tag,
# add an entry and use it. To retire a tag, remove it and update the resources.
#
# Format:
#   slug: description

