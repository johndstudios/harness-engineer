name: Cleanup preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  remove-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Remove pr-${{ github.event.number }} from gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Publish an empty directory to the preview subdirectory, removing it.
          publish_dir: .github/empty
          destination_dir: pr-${{ github.event.number }}
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Remove preview for PR #${{ github.event.number }}"
      - name: Comment cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNum,
              body: `Preview for PR #${prNum} has been removed.`,
            });