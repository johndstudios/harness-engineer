name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the crawl workflow for its auto-archive PR, because PRs
  # opened with GITHUB_TOKEN don't trigger pull_request runs.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-resources:
    name: Lint resource front matter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate resource files
        run: python3 scripts/lint_resources.py content/resources
      - name: Freshness summary
        run: python3 scripts/audit_freshness.py --report /dev/null

  # Blocking: links a PR adds or changes must work. Rot in existing entries
  # is not the contributor's problem; the weekly freshness audit handles it.
  link-check:
    name: Check links (changed resources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect links from changed resource files
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD); fi
          git diff --name-only --diff-filter=AM "$base"...HEAD -- 'content/resources/*.md' > changed.txt || true
          : > links.txt
          while read -r f; do
            [ -f "$f" ] || continue
            # Archived entries are expected to be dead.
            grep -q '^lifecycle: archived' "$f" && continue
            sed -n 's/^link: *//p' "$f" | tr -d '"' >> links.txt
          done < changed.txt
          echo "Changed resources: $(wc -l < changed.txt), links to check: $(wc -l < links.txt)"
          cat links.txt
          echo "count=$(wc -l < links.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Check links
        if: steps.changed.outputs.count != '0'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose links.txt
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Report-only sweep of the README and docs; failures show up as warnings.
  link-check-readme:
    name: Check links (README, report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude '^https://openai\.com/index/harness-engineering/?$'
            --exclude '^https://www\.preprints\.org/manuscript/202603\.1756/?$'
            --exclude '^https://harness-engineer\.dev'
            --exclude '^https://johndstudios\.github\.io'
            README.md
            CONTRIBUTING.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  link-check-site:
    name: Check links (built site, report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            --root-dir public
            --exclude '^https://openai\.com/index/harness-engineering/?$'
            --exclude '^https://www\.preprints\.org/manuscript/202603\.1756/?$'
            --exclude '^https://harness-engineer\.dev'
            --exclude '^https://johndstudios\.github\.io'
            --exclude '^https://github\.com/johndstudios/harness-engineer/'
            --exclude '^https://repository-images\.githubusercontent\.com'
            --exclude '\.(png|jpg|jpeg|gif|svg|webp|ico|css|js)$'
            --exclude 'pagefind/'
            'public/**/*.html'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate contributor data
        run: python3 scripts/generate_contributors.py
      - name: Build Hugo
        run: |
          BASE_URL="${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"
          hugo --gc --minify --baseURL "${BASE_URL}/"
        env:
          HUGO_ENV: production
          HUGO_PARAM_SUBMITENDPOINT: ${{ vars.HUGO_PARAM_SUBMITENDPOINT }}
          HUGO_PARAM_FORMSECRET: ${{ secrets.HUGO_PARAM_FORMSECRET }}
      - name: Build Pagefind index
        run: npx pagefind --site public
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/

  preview:
    name: Preview deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Pushes the preview to gh-pages. Fork PRs get a read-only token, so they
    # skip the preview rather than fail.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate contributor data
        run: python3 scripts/generate_contributors.py
      - name: Build Hugo (PR baseURL)
        # Build with a subdirectory baseURL so assets resolve under /pr-<n>/.
        run: |
          PR_NUM="${{ github.event.number }}"
          BASE_URL="${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"
          hugo --gc --minify --baseURL "${BASE_URL}/pr-${PR_NUM}/"
        env:
          HUGO_ENV: production
          HUGO_PARAM_SUBMITENDPOINT: ${{ vars.HUGO_PARAM_SUBMITENDPOINT }}
          HUGO_PARAM_FORMSECRET: ${{ secrets.HUGO_PARAM_FORMSECRET }}
      - name: Build Pagefind index
        run: npx pagefind --site public
      - name: Deploy preview to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          destination_dir: pr-${{ github.event.number }}
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Preview PR #${{ github.event.number }}"
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          BASE_URL: ${{ vars.PAGES_BASE_URL }}
        with:
          script: |
            const prNum = context.payload.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseUrl = process.env.BASE_URL || `https://${owner}.github.io/${repo}`;
            const previewUrl = `${baseUrl}/pr-${prNum}/`;
            const body = `Preview deployed: ${previewUrl}`;
            const marker = "<!-- harness-engineer-preview -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNum,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id,
                body: `${marker}\n\nPreview deployed: ${previewUrl}`,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNum,
                body: `${marker}\n\nPreview deployed: ${previewUrl}`,
              });
            }